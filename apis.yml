aid: felix
name: Felix
description: >-
  Félix (Félix Pago) is a US-based fintech building financial services for the
  Latino community in the United States. Its core product lets users send
  remittances to Latin America in seconds through a WhatsApp message, with no
  app download or physical-location visit required, covering 9+ countries
  including Mexico, Guatemala, Honduras, El Salvador, Nicaragua, Colombia,
  Dominican Republic, Ecuador and Peru with real-time exchange rates, no hidden
  fees, over 40,000 cash pickup and deposit locations, and Spanish-language
  support. Félix is expanding beyond remittances into accounts, credit building,
  savings and investing for immigrants. Backed by General Catalyst and QED
  Investors. This profile is maintained in the API Evangelist network; Félix is
  a consumer-facing service and does not currently publish a public developer
  API or documentation.
